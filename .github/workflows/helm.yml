name: helm

on:
  pull_request:
    paths: ['deploy/helm/**']
  push:
    branches: [main]
    tags: ['v*']

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.14.4

      - name: helm lint
        run: helm lint deploy/helm/approvo

      - name: helm template (render check with default values)
        run: helm template approvo deploy/helm/approvo | head -200

      - name: helm package (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          helm package deploy/helm/approvo -d dist
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 30

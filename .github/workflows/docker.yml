name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 镜像发布到 Docker Hub 的 sagawayco/approvo-core（GHCR 走不通:org 策略不允许公开包）。
#
# 🔴 第三方 action 一律钉到 commit SHA,不用 @v3 这类可变 tag:
#    本 workflow 持有 registry 的可写凭据,而可变 tag 指向的代码随时可能被换掉。
# 🔴 触发器刻意只有 push(main/tag) 与手动:绝不用 pull_request_target / workflow_run,
#    那两个会让 fork 的 PR 在【带 secret】的上下文里跑。
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          # 🔴 这里【必须写死】,因为 registry 命名空间(sagawayco)与 GitHub owner(Sagaway-Co)不同名。
          #    与之前那个 bug 的区别:那次是写死成【别的仓的包名】导致跨仓污染,
          #    这次是刻意的跨 registry 映射。改这一行时,README 里的 docker pull 也要同步改。
          images: docker.io/sagawayco/approvo-core
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

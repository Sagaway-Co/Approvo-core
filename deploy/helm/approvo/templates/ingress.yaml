{{- if .Values.ingress.enabled -}}
{{- $svc := include "approvo.fullname" . -}}
{{- $port := .Values.service.port -}}
{{- $className := .Values.ingress.className -}}
{{- if .Values.ingress.public.enabled }}
---
# 公网入口:只放行 ingress.public.paths 里列出的路径(默认 /release 与 /healthz);
# /admin、/api/* 不在此 Ingress 上 → 公网够不到,这是结构性隔离(不依赖认证,依赖路由).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}-public
  labels:
    {{- include "approvo.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ $className }}
  {{- with .Values.ingress.public.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.public.host }}
      http:
        paths:
          {{- range (.Values.ingress.public.paths | default (list "/release" "/healthz")) }}
          - path: {{ . }}
            pathType: Prefix
            backend: {service: {name: {{ $svc }}, port: {number: {{ $port }}}}}
          {{- end }}
{{- end }}
{{- if .Values.ingress.admin.enabled }}
---
# 内网管理入口:暴露全部路径 (含 /admin);仅内网 DNS 解析.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}-admin
  labels:
    {{- include "approvo.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ $className }}
  {{- with .Values.ingress.admin.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.admin.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $svc }}, port: {number: {{ $port }}}}}
{{- end }}
{{- end }}

[pytest]
# 🔴 testpaths 必须显式限定为 tests/：
#   pytest 默认会递归收集全仓的 test_*.py，而 scripts/test_deploy.py 是【手动运行的
#   工具脚本】不是用例（用法见其 docstring），且它 import 的 app.deployer 在重构成
#   app.deployers 后早已失效。仓里此前没有 tests/ 目录，CI 的 pytest 一直被跳过，
#   所以这个断裂从未暴露。一旦新增 tests/ 就会把它一起收集 ——
#   而【收集期 ImportError 会连坐整个套件】，CI 直接变红。
testpaths = tests

# CI 里跑的是裸 `pytest -q`，没有 PYTHONPATH；不设这个，tests 里 import app 会失败。
pythonpath = .
